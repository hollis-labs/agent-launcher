# Tachyon's own dev launch bag — boot a claude-code agent into the
# Tachyon repo. claude-code runner, hybrid isolation.
spec: tether.launch
name: tachyon-claude
inputs:
  work_dir: ~/dev/hollis-labs/apps/tachyon
  runner: claude-code
  isolation: hybrid
  project: tachyon
  agent_role: backend
  display_name: "Tachyon — Engineer"
