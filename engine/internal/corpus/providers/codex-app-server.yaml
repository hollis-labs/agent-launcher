# Runtime-binding contract — codex-app-server runner.
#
# codex-app-server is the interactive Codex runner speaking JSON-RPC 2.0
# over stdio against a long-lived Codex app-server process.
#
# `id` is the top-level field the file-backed registrar keys the
# RegistryObjectRef name on — it MUST equal the `runner` token.
id: codex-app-server
meta:
  ref:
    kind: runtime-binding
    name: codex-app-server
  schema_version: v1alpha1
  interface: runtime-binding/v1
binding:
  provider: codex
  runtime_kind: jsonrpc-stdio
