# Runtime-binding contract — claude-pty runner.
#
# claude-pty is the interactive Claude CLI running behind a long-lived
# pseudo-terminal (the TUI experience). A human is always attached.
#
# `id` is the top-level field the file-backed registrar keys the
# RegistryObjectRef name on — it MUST equal the `runner` token.
id: claude-pty
meta:
  ref:
    kind: runtime-binding
    name: claude-pty
  schema_version: v1alpha1
  interface: runtime-binding/v1
binding:
  provider: claude
  runtime_kind: pty
