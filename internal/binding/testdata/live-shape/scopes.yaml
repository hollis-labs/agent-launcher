# Scope aliases: a short name a binding's `scope` may be written as instead of
# a path. `cairn boot --scope` takes either as well.
#
# This file is on its way out. A binding is to carry its directory as a path
# and the registry retires with the alias; until then it lives here rather than
# in bindings/, where every file is one binding named after itself.

agent-setup: ~/dev/projects/agent-setup
cairn:       ~/dev/projects/cairn
chrispian:   ~/dev/chrispian
nanite:      ~/dev/hollis-labs/apps/nanite
tesseract:   ~/dev/hollis-labs/apps/tesseract
torque:      ~/dev/hollis-labs/apps/torque
