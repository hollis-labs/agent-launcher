# Bindings name a profile plus a default scope; scopes give a path an alias.
# Both are operator data rather than agent content, which is why they are one
# small file instead of one file each.
#
# `cairn boot <name>` looks here first and falls back to a profile of the same
# id. `--scope` overrides whatever a binding declares.

scopes:
  chrispian:   ~/dev/chrispian
  cairn:       ~/dev/projects/cairn
  agent-setup: ~/dev/projects/agent-setup
  nanite:      ~/dev/hollis-labs/apps/nanite
  tesseract:   ~/dev/hollis-labs/apps/tesseract
  torque:      ~/dev/hollis-labs/apps/torque

bindings:
  # Carried over from the previous system.
  chrispian:    { profile: planner,      scope: chrispian }
  nanite:       { profile: orchestrator, scope: nanite }

  # The conductor holds no scope. It is pointed at the launchpad because a
  # session has to start somewhere, not because the work lives there.
  conductor:    { profile: conductor,    scope: chrispian }

  eng-cairn:    { profile: engineer,     scope: cairn }
  eng-setup:    { profile: engineer,     scope: agent-setup }
  eng-nanite:   { profile: engineer,     scope: nanite }
  orch-nanite:  { profile: orchestrator, scope: nanite }
  dir-nanite:   { profile: director,     scope: nanite }
